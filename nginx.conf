server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Allow larger uploads (align with PHP settings)
    client_max_body_size 100M;
    client_body_timeout 120s;

    # Avoid issues with sendfile in some Docker setups
    sendfile off;

    # Security headers (basic)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # must match your PHP component name in DO App Platform
        fastcgi_pass php:9000;

        # tuning for long requests/uploads and larger responses
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
    }

    # Deny access to hidden files (env, git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}